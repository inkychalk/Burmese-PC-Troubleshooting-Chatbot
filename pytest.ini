[pytest]
# Pytest configuration for Burmese PC Chatbot

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=backend
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70

# Markers
markers =
    api: API endpoint tests
    database: Database operation tests
    language: Language detection tests
    engine: Chat engine tests
    frontend: Frontend tests
    integration: End-to-end integration tests
    security: Security tests
    slow: Slow running tests
    smoke: Smoke tests for quick verification

# Timeout for tests (seconds)
timeout = 30

# Minimum Python version
minversion = 7.0
