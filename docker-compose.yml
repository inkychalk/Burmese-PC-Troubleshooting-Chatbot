services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: burmese-pc-chatbot-backend
    ports:
      - "5000:5000"
    volumes:
      - chatbot-data:/data
    environment:
      - FLASK_ENV=production
      - DATABASE_PATH=/data/db.sqlite
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SECRET_KEY=${SECRET_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: nginx:alpine
    container_name: burmese-pc-chatbot-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chatbot-data:
    driver: local
